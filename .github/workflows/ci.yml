name: CyberGuard CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: >-
          python -m unittest
          backend.tests.test_auth
          backend.tests.test_analyzer
          backend.tests.test_storage
          backend.tests.test_ingest_api
          backend.tests.test_cloudflare_ingest
          backend.tests.test_url_model
          -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Azure deployment image
        run: docker build --tag cyberguard:ci .
